name: Tracked Problem
description: 追蹤非 trivial 問題、回歸、治理缺口或需要 OpenSpec 的變更
title: "[tracked] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 問題摘要
      description: 用白話描述要解決的問題。
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: 請填入既有 milestone；trivial 例外請填 `trivial-exception`。
    validations:
      required: true
  - type: textarea
    id: duplicate-search
    attributes:
      label: 查重結果
      description: 說明已搜尋哪些症狀 / 頁面 / API / 錯誤訊息 / OpenSpec change。
    validations:
      required: true
  - type: textarea
    id: openspec
    attributes:
      label: OpenSpec 判斷
      description: 若需要 OpenSpec，填 change id；若不需要，說明原因。
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: 進度總表
      value: |
        | Status | Owner | Branch / PR | OpenSpec | Verification | Next Action |
        | --- | --- | --- | --- | --- | --- |
        | accepted | _待指派_ | _pending_ | _pending_ | _pending_ | _pending_ |
    validations:
      required: true
